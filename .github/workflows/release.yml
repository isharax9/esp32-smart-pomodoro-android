name: Smart Pomodoro Build & Release Pipeline

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test --continue

      - name: Build Debug APK
        if: "${{ github.event.inputs.build_type == 'debug' || startsWith(github.ref, 'refs/heads/') }}"
        run: ./gradlew assembleDebug

      - name: Build Release APK & Bundle
        if: "${{ github.event.inputs.build_type == 'release' || startsWith(github.ref, 'refs/tags/v') }}"
        run: |
          ./gradlew assembleRelease bundleRelease || ./gradlew assembleDebug
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartPomodoro-APK
          path: app/build/outputs/apk/**/*.apk

      - name: Upload AAB (Play Store Bundle) Artifact
        if: "${{ startsWith(github.ref, 'refs/tags/v') || github.event.inputs.build_type == 'release' }}"
        uses: actions/upload-artifact@v4
        with:
          name: SmartPomodoro-AAB
          path: app/build/outputs/bundle/**/*.aab

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
          generate_release_notes: true
          draft: false
          prerelease: false
